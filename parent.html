    'use strict';
    if (!window.FF) { document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;text-align:center;">FeeFlow could not load. Check your internet connection and refresh the page.</div>'; throw new Error('FeeFlow client failed to load'); }
    const ico = FFUI.ico;
    const money = FFUI.money;
    const fmtDate = FFUI.fmtDate;
    const fmtDateTime = FFUI.fmtDateTime;
    const timeAgo = FFUI.timeAgo;
    // Only harmless display preferences (sidebar width, hidden report cards) stay on this device.
    const safeStorage = {
      getItem(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      setItem(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* ignore */ } },
      removeItem(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
    };
    let session = null;
    let parent = null;
    let school = null;
    let children = [];
    let payments = [];
    let notifications = [];
    let receiptViewMode = 'list';
    let receiptSearchQuery = '';
    let receiptSortMode = 'date-desc';
    let reportViewMode = 'list';
    let hiddenReports = (() => { try { const v = JSON.parse(safeStorage.getItem('ff_hidden_reports') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } })();
    let activeEditingChildId = null;

    // ======================= SUPABASE DATA LAYER =======================
    const sb = FF.sb;
    let allParents = [];
    let published = null;
    let terms = [];
    let pendingCount = 0;
    let rejectedCount = 0;
    let realtimeChannel = null;
    let reloadTimer = null;
    let payPollTimer = null;

    let loginEmail = '';

    const colorFor = FFUI.colorFor;    async function fnErrorMessage(error) {
      try { const body = await error.context.json(); if (body && body.error) return body.error; } catch (e) { /* fall through */ }
      return FF.friendlyError(error);
    }
    function toast(message) { alert(message); }

    /* Every failure names the exact query that broke, so "it does not load" becomes
       "student_balances: permission denied" instead of a shrug. */
    const QUERY_LABELS = {
      schools: 'your school details', student_balances: 'your children',
      payments: 'payments and receipts', notifications: 'notifications',
      parent_students: 'child links', fee_structure_published: 'the published fee structure',
      terms: 'term dates', parents: 'your account'
    };
    function describeQueryError(error) {
      if (!error) return 'Unknown error.';
      const friendly = FF.friendlyError(error);
      if (/no internet|failed to fetch|networkerror/i.test(String(error.message || ''))) {
        return 'No internet connection. Check your mobile data or Wi-Fi and try again.';
      }
      if (error.code === '42501' || /permission denied|row-level security/i.test(String(error.message || ''))) {
        return 'The database refused this request (' + friendly + '). Your school\'s FeeFlow access may not be set up yet — please tell the school office.';
      }
      if (error.code === 'PGRST116' || /does not exist/i.test(String(error.message || ''))) {
        return 'A table this page needs is missing in the database (' + friendly + '). The latest database migration has not been applied yet.';
      }
      return friendly;
    }
    function renderMessagePage(title, text, detail) {
      const offline = (typeof navigator !== 'undefined' && navigator.onLine === false);
      document.getElementById("app").innerHTML = `
        <div class="ff-empty">
          <div class="ff-card" style="max-width:520px;text-align:left">
            <div class="ff-alert error" role="alert" style="margin-bottom:16px"><i data-ico="alert"></i>
              <div><div class="ff-alert-title">${escapeHtml(title)}</div><div>${escapeHtml(text)}</div></div>
            </div>
            ${offline ? '<div class="ff-alert warning" role="alert" style="margin-bottom:16px"><i data-ico="wifiOff"></i><div>Your device is offline. Reconnect and try again.</div></div>' : ''}
            ${detail ? `<p class="ff-hint" style="margin-bottom:16px"><i data-ico="info"></i> ${escapeHtml(detail)}</p>` : ''}
            <div class="ff-btn-group">
              <button class="ff-btn ff-btn-primary" onclick="location.reload()"><i data-ico="refresh" data-size="ff-ico-sm"></i> Try again</button>
              <button class="ff-btn ff-btn-outline" onclick="logout()"><i data-ico="logout" data-size="ff-ico-sm"></i> Sign out</button>
            </div>
          </div>
        </div>`;
      FFUI.paint(document);
    }

    async function initialize() {
      const profile = await FF.requireRole('parent');
      if (!profile) return;                                     // sent to the login page
      loginEmail = profile.email || '';
      const { data, error } = await sb.from('parents').select('id, school_id, full_name, phone, email, phone_verified, created_at').order('created_at', { ascending: true });
      if (error) { renderMessagePage('Unable to load your account', describeQueryError(error), 'Failed while reading: your account (parents).'); return; }
      allParents = data || [];
      if (!allParents.length) { renderMessagePage('No school linked yet', 'Your account is not connected to a school. Register again from the sign-in page and choose your school.'); return; }
      const wanted = safeStorage.getItem('ff_parent_active');
      parent = allParents.find(x => x.id === wanted) || allParents[0];
      parent.name = parent.full_name;
      await loadSchoolData();
      renderShell();
      renderAllViews();
      subscribeRealtime();
    }

    async function loadSchoolData() {
      const pid = parent.id, sid = parent.school_id;
      const [schoolR, kidsR, payR, notifR, linksR, pubR, termsR] = await Promise.all([
        sb.from('schools').select('id, name, location, paybill, address, phone').eq('id', sid).maybeSingle(),
        sb.from('student_balances').select('*').eq('school_id', sid).order('full_name'),
        sb.from('payments').select('id, student_id, amount, method, status, mpesa_receipt, receipt_no, note, created_at, completed_at').order('created_at', { ascending: false }).limit(500),
        sb.from('notifications').select('id, title, body, unread, created_at, type').eq('audience', 'parent').eq('parent_id', pid).order('created_at', { ascending: false }).limit(100),
        sb.from('parent_students').select('student_id, status').eq('parent_id', pid),
        sb.from('fee_structure_published').select('data, term_names, published_at').eq('school_id', sid).maybeSingle(),
        sb.from('terms').select('name, start_date, end_date, deadline, status').eq('school_id', sid).order('start_date', { ascending: false })
      ]);
      const named = [['schools', schoolR], ['student_balances', kidsR], ['payments', payR], ['notifications', notifR],
                     ['parent_students', linksR], ['fee_structure_published', pubR], ['terms', termsR]];
      const broke = named.find(([, r]) => r.error);
      if (broke) {
        const err = Object.assign({}, broke[1].error, { feeflowQuery: broke[0] });
        throw err;
      }
      school = schoolR.data || { id: sid, name: 'School', paybill: '' };
      children = (kidsR.data || []).filter(r => r.active).map(r => ({
        id: r.id, name: r.full_name, adm: r.admission_no, class: r.class_name, boarding: !!r.boarding,
        total: Number(r.total_due || 0), paid: Number(r.paid || 0), balance: Number(r.balance || 0), noFee: r.fee_status === 'no_fee',
        status: r.fee_status, initials: initials(r.full_name), color: colorFor(r.id)
      }));
      const byId = Object.fromEntries(children.map(c => [c.id, c]));
      const STATUS = { completed: 'Paid', pending: 'Pending', failed: 'Failed', cancelled: 'Failed', timeout: 'Failed' };
      payments = (payR.data || []).filter(x => byId[x.student_id]).map(x => ({
        id: x.id, studentId: x.student_id, studentName: byId[x.student_id].name, class: byId[x.student_id].class, adm: byId[x.student_id].adm,
        amount: Number(x.amount), method: /mpesa/.test(x.method) ? 'M-Pesa' : cap(x.method), status: STATUS[x.status] || x.status, rawStatus: x.status,
        ref: x.mpesa_receipt || x.receipt_no || (x.status === 'pending' ? 'Awaiting confirmation' : '—'), receiptNo: x.receipt_no || '', mpesaCode: x.mpesa_receipt || '',
        date: fmtDateTime(x.completed_at || x.created_at), paybill: school.paybill
      }));
      notifications = (notifR.data || []).map(n => ({ ...n, time: timeAgo(n.created_at) }));
      const links = linksR.data || [];
      pendingCount = links.filter(l => l.status === 'pending').length;
      rejectedCount = links.filter(l => l.status === 'rejected').length;
      published = pubR.data && pubR.data.data && Array.isArray(pubR.data.data.levels) ? pubR.data : null;
      terms = termsR.data || [];
    }
    const cap = (t) => String(t || '').charAt(0).toUpperCase() + String(t || '').slice(1);

    async function refresh() {
      try { await loadSchoolData(); renderAllViews(); } catch (e) { console.error(e); }
    }
    function subscribeRealtime() {                               // new payments / notices show up without refreshing
      if (!sb.channel) return;
      try {
        if (realtimeChannel && sb.removeChannel) sb.removeChannel(realtimeChannel);
        const reload = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(refresh, 800); };
        realtimeChannel = sb.channel('parent-' + parent.id)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'payments' }, reload)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications', filter: 'parent_id=eq.' + parent.id }, reload)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'parent_students', filter: 'parent_id=eq.' + parent.id }, reload)
          .subscribe();
      } catch (e) { /* live updates are optional */ }
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[character]));
    }

    // Accepts 07XXXXXXXX, 01XXXXXXXX, 7XXXXXXXX, 2547XXXXXXXX, +2547XXXXXXXX
    // Returns the normalized 2547XXXXXXXX / 2541XXXXXXXX format M-Pesa expects, or null if invalid.
    function normalizeKenyanPhone(raw) {
      const digits = String(raw || "").replace(/\D/g, "");
      if (/^254(7|1)\d{8}$/.test(digits)) return digits;
      if (/^0(7|1)\d{8}$/.test(digits)) return "254" + digits.slice(1);
      if (/^(7|1)\d{8}$/.test(digits)) return "254" + digits;
      return null;
    }




    
let currentParentSidebarMode = safeStorage.getItem('ff_parent_sidebar_mode') || 'standard';
let lastActiveParentView = 'dashboard';
let activeParentPreviewNotifId = null;

function setParentSidebarMode(mode) {
    currentParentSidebarMode = mode;
    safeStorage.setItem('ff_parent_sidebar_mode', mode);
    document.body.classList.remove('sidebar-narrow', 'sidebar-standard', 'sidebar-wide', 'sidebar-compact', 'sidebar-closed');
    document.body.classList.add('sidebar-' + mode);
}


function setupParentSidebarResizer() {
    const sidebar = document.querySelector('.sidebar');
    const resizer = document.querySelector('.sidebar-resizer');
    if (!sidebar || !resizer) return;

    let isResizing = false;
    resizer.addEventListener('mousedown', function(e) {
        isResizing = true;
        resizer.classList.add('resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!isResizing) return;
        let newWidth = e.clientX;
        if (newWidth < 70) {
            document.body.classList.add('sidebar-closed');
            const main = document.querySelector('.main-content');
            if (main) main.style.marginLeft = '0px';
            return;
        } else {
            document.body.classList.remove('sidebar-closed');
        }
        if (newWidth < 160) newWidth = 160;
        if (newWidth > 480) newWidth = 480;
        
        document.documentElement.style.setProperty('--sidebar-width', newWidth + 'px');
        const main = document.querySelector('.main-content');
        if (main) main.style.marginLeft = newWidth + 'px';
    });

    document.addEventListener('mouseup', function() {
        if (isResizing) {
            isResizing = false;
            resizer.classList.remove('resizing');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            const currentWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 250;
            safeStorage.setItem('ff_custom_parent_sidebar_width', String(currentWidth));
            safeStorage.setItem('ff_parent_sidebar_closed', 'false');
        }
    });

    // Load saved width
    const savedWidth = safeStorage.getItem('ff_custom_parent_sidebar_width');
    const savedState = safeStorage.getItem('ff_parent_sidebar_closed');
    if (savedWidth && !isNaN(savedWidth)) {
        const w = Number(savedWidth);
        document.documentElement.style.setProperty('--sidebar-width', w + 'px');
        const main = document.querySelector('.main-content');
        if (main && savedState !== 'true') main.style.marginLeft = w + 'px';
    }
    if (savedState === 'true') {
        document.body.classList.add('sidebar-closed');
        const main = document.querySelector('.main-content');
        if (main) main.style.marginLeft = '0px';
    }
}

function toggleParentSidebarState() {
    const isClosed = document.body.classList.contains('sidebar-closed');
    const main = document.querySelector('.main-content');
    const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 250;
    if (isClosed) {
        document.body.classList.remove('sidebar-closed');
        if (main) main.style.marginLeft = w + 'px';
        safeStorage.setItem('ff_parent_sidebar_closed', 'false');
    } else {
        document.body.classList.add('sidebar-closed');
        if (main) main.style.marginLeft = '0px';
        safeStorage.setItem('ff_parent_sidebar_closed', 'true');
    }
}

/* replaced toggleParentSidebarState */ function old_toggleParentSidebarState() {
    if (currentParentSidebarMode === 'closed' || currentParentSidebarMode === 'compact') {
        setParentSidebarMode('standard');
    } else {
        setParentSidebarMode('compact');

}

function initParentAutoSuggestAndSearchableSelects() {
    const select = document.getElementById('paymentStudent');
    if (select && !select.dataset.autoSuggestInit) {
        select.dataset.autoSuggestInit = 'true';
        select.style.display = 'none';

        const wrapper = document.createElement('div');
        wrapper.className = 'auto-suggest-wrapper';
        wrapper.style.cssText = 'position:relative;width:100%;flex:1;';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'form-input auto-suggest-input';
        input.placeholder = '🔍 Search child to pay for...';
        input.style.cssText = 'width:100%;';
        
        const popup = document.createElement('div');
        popup.className = 'auto-suggest-popup';
        popup.style.cssText = 'position:absolute;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:var(--ff-surface);border:1.5px solid var(--ff-green);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,0.18);z-index:99999;display:none;';

        wrapper.appendChild(input);
        wrapper.appendChild(popup);
        select.parentNode.insertBefore(wrapper, select);

        function updateList() {
            const q = input.value.trim().toLowerCase();
            const options = Array.from(select.options).filter(o => o.value !== '');
            const matches = options.filter(o => !q || o.text.toLowerCase().includes(q));
            
            if (!matches.length) {
                popup.innerHTML = '<div style="padding:10px 12px;color:var(--ff-muted);font-size:12px;">No matching children found.</div>';
            } else {
                popup.innerHTML = matches.map(o => `
                    <div class="ff-school-opt" data-value="${o.value}" style="padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--ff-border);transition:background 0.15s;color:var(--ff-text);">
                        <i data-ico="student" style="margin-right:6px;color:var(--ff-green);"></i> ${escapeHtml(o.text)}
                    </div>
                `).join('');
            }
            popup.style.display = 'block';
        }

        input.addEventListener('focus', updateList);
        input.addEventListener('input', updateList);

        popup.addEventListener('click', e => {
            const item = e.target.closest('.auto-suggest-item');
            if (!item) return;
            const val = item.dataset.value;
            select.value = val;
            input.value = item.textContent.trim().replace(/^.*?\s+/, '');
            popup.style.display = 'none';
            select.dispatchEvent(new Event('change'));
        });

        document.addEventListener('click', e => {
            if (!wrapper.contains(e.target)) popup.style.display = 'none';
        });

        select.addEventListener('change', () => {
            const opt = select.options[select.selectedIndex];
            if (opt && opt.value) input.value = opt.text;
            else input.value = '';
        });
    }
}

          <h4 style="margin:0 0 8px 0;color:var(--ff-text);font-size:14px;">Assessment & Remaining Balance</h4>

            <div class="ff-stat" style="padding:10px;"><div class="ff-label" style="font-size:11px;">Paid</div><div class="ff-detail-value" style="font-size:16px;color:var(--ff-green);">${money(child.paid)}</div></div>

    function initials(name) {
      return String(name || "")
        .split(/\s+/)
        .filter(Boolean)
        .map(part => part[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();
    }

    function renderPayments() {
      const rows = payments.length
        ? payments.map(payment => `
            <tr>
              <td><strong>${escapeHtml(payment.ref || payment.id)}</strong></td>
              <td>${escapeHtml(payment.studentName || "—")}</td>
              <td class="ff-money green">${money(payment.amount)}</td>

      document.getElementById("view-payments").innerHTML = `
        <div class="ff-page-head">
          <div>
            <h1 class="ff-page-title">Payments & Receipts</h1>
            <p class="ff-page-desc">Your fee payments and official receipts</p>

    function receiptsMarkup() {
      const confirmed = payments.filter(x => x.rawStatus === 'completed');
      if (!confirmed.length) {
        return '<div class="ff-card"><div class="ff-empty">Receipts appear after a payment is confirmed.</div></div>';
      }
      return confirmed.map(payment => `
        <article class="ff-receipt">
          <div class="ff-receipt-logo">
            <div class="ff-receipt-school">${escapeHtml(school.name || "School")}</div>
            <div class="ff-receipt-title">OFFICIAL FEE RECEIPT</div>
          </div>
          ${receiptRow("Receipt", payment.receiptNo || payment.ref)}
          ${receiptRow("Student", payment.studentName || "—")}
          ${receiptRow("Class", payment.class || "—")}
          ${receiptRow("Amount", money(payment.amount))}
          ${receiptRow("Method", payment.method || "M-Pesa")}
          ${payment.mpesaCode ? receiptRow("M-Pesa code", payment.mpesaCode) : ""}
          ${receiptRow("Paybill", payment.paybill || school.paybill || "—")}
          ${receiptRow("Date", payment.date || "—")}
          <div class="ff-btn-group">
            <button class="ff-btn ff-btn-outline" onclick="printReceipt('${escapeHtml(payment.id)}')">${ico('printer', 'ff-ico-sm')} Print</button>

          </div>

    function receiptRow(label, value) {
      return `
        <div class="ff-receipt-row">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value)}</strong>
        </div>
      `;
    }
    // (these two were called but never defined in the old page, so printing a receipt used to crash)
    function receiptHtml(payment) {
      const e = escapeHtml, line = (k, v) => `<tr><td style="color:#64748b;padding:6px 0;">${e(k)}</td><td style="text-align:right;font-weight:600;padding:6px 0;">${e(v)}</td></tr>`;
      return `<div style="font-family:Arial,sans-serif;max-width:560px;margin:30px auto;padding:30px;border:2px solid #0c2d57;border-radius:10px;page-break-inside:avoid;">
        <div style="text-align:center;border-bottom:2px solid #e2e8f0;padding-bottom:14px;margin-bottom:14px;">
          <div style="font-size:20px;font-weight:800;color:#0c2d57;">${e(school.name || 'School')}</div>
          <div style="font-size:12px;color:#64748b;">${e([school.address, school.phone].filter(Boolean).join(' • '))}</div>
          <div style="font-size:13px;font-weight:700;letter-spacing:1px;margin-top:10px;">OFFICIAL FEE RECEIPT</div>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:14px;">
          ${line('Receipt no.', payment.receiptNo || payment.ref)}${payment.mpesaCode ? line('M-Pesa code', payment.mpesaCode) : ''}
          ${line('Student', payment.studentName)}${line('Admission no.', payment.adm)}${line('Class', payment.class)}
          ${line('Method', payment.method)}${line('Date', payment.date)}
          <tr><td style="padding:12px 0;border-top:2px solid #0c2d57;font-weight:700;">Amount paid</td><td style="text-align:right;padding:12px 0;border-top:2px solid #0c2d57;font-weight:800;font-size:18px;color:#059669;">${e(money(payment.amount))}</td></tr>
        </table>
        <p style="font-size:11px;color:#64748b;text-align:center;margin:14px 0 0;">Payment confirmed by FeeFlow. Keep this receipt for your records.</p>
      </div>`;
    }
    function receiptsHtml(list) {
      const body = list.filter(x => x.rawStatus === 'completed').map(receiptHtml).join('');
      return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>FeeFlow receipts</title></head><body style="margin:0">${body || '<p style="font-family:Arial;padding:30px;">No confirmed payments yet.</p>'}</body></html>`;
    }

    function normalizeGrade(value) {
      return String(value || "")
        .replace(/[A-Z]$/, "")
        .replace(/^Class /i, "Grade ")
        .trim()
        .toLowerCase();
    }

    function findPublishedGrade(publication, child) {
      for (const level of publication?.levels || []) {
        const grade = (level.grades || []).find(item => normalizeGrade(item.name) === normalizeGrade(child.class));
        if (grade) return { level: level.name, grade };
      }
      return null;
    }

    /* window.children is a built-in HTMLCollection, so inline onclick handlers cannot
       see the page-level `children` array. Everything the markup triggers lives here. */
    function clearAllReports() {
      hiddenReports = children.map(c => c.id);
      safeStorage.setItem('ff_hidden_reports', JSON.stringify(hiddenReports));
      renderFeeReports();
    }

    function restoreAllReports() {
      hiddenReports = [];
      safeStorage.setItem('ff_hidden_reports', '[]');
      renderFeeReports();
    }

    function renderFeeReports() {
      const publication = published ? published.data : null;
      const termNames = (published && published.term_names) || ["Term 1", "Term 2", "Term 3"];

      const visibleChildren = children.filter(c => !hiddenReports.includes(c.id));

      let body = "";
      if (!publication) {
        body = '<div class="ff-card"><div class="ff-empty">Your school has not published a fee structure yet.</div></div>';
      } else if (!children.length) {
        body = '<div class="ff-card"><div class="ff-empty">Add a child to view a matching fee report.</div></div>';
      } else if (!visibleChildren.length) {
        body = '<div class="ff-card"><div class="ff-empty">All fee reports are currently minimized or cleared. <button class="ff-btn ff-btn-outline" style="margin-top:10px;" onclick="restoreAllReports()">Restore All Reports</button></div></div>';
      } else if (reportViewMode === 'icon') {
        body = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;max-width:780px;margin:0 auto;">' +
          visibleChildren.map(child => {
            const match = findPublishedGrade(publication, child);
            const due = Number(child.balance||0) > 0;
            return `
              <div class="ff-card" style="padding:18px;text-align:center;position:relative;border:1.5px solid var(--ff-border);">
                <button onclick="deleteFeeReport('${child.id}')" title="Clear/Hide report" style="position:absolute;top:8px;right:8px;background:none;border:none;color:var(--ff-red);font-size:14px;cursor:pointer;">✕</button>
                <div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#0c2d57,#1a6dcc);color:white;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 10px;">📊</div>
                <div style="font-weight:700;font-size:15px;color:var(--ff-text);">${escapeHtml(child.name)}</div>
                <div style="font-size:12px;color:var(--ff-muted);margin-top:2px;">${escapeHtml(child.class||'Grade')}</div>
                <div style="font-size:17px;font-weight:800;color:${due?'var(--ff-red)':'var(--ff-green)'};margin:12px 0;">Balance: ${money(child.balance)}</div>
                <button class="ff-btn ff-btn-outline" style="width:100%;font-size:12px;padding:6px;" onclick="reportViewMode='file';renderFeeReports();">🔍 Expand Details</button>
              </div>
            `;
          }).join('') + '</div>';
      } else if (reportViewMode === 'list') {
        body = '<div style="max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px;">' +
          visibleChildren.map(child => {
            const match = findPublishedGrade(publication, child);
            if (!match) {
              return `<div class="ff-card"><div class="ff-card-head"><span>${escapeHtml(child.name)}</span><button onclick="deleteFeeReport('${child.id}')" style="background:none;border:none;color:var(--ff-red);cursor:pointer;">✕ Delete Report</button></div><div class="ff-card-body"><div class="ff-alert info">No published fee structure matches ${escapeHtml(child.class)}.</div></div></div>`;
            }
            const terms = termNames.map((term, termIndex) => {
              const rows = (match.grade.fees || []).filter(f=>!f.boarderOnly||child.boarding).map(fee => `
                <tr>
                  <td>${escapeHtml(fee.name)}</td>
                  <td style="color:var(--ff-muted);">${escapeHtml(fee.category||'General')}</td>
                  <td class="ff-money">${money(fee.amounts?.[termIndex] || 0)}</td>
                </tr>
              `).join("");
              const total = (match.grade.fees || []).filter(f=>!f.boarderOnly||child.boarding).reduce((sum, fee) => sum + Number(fee.amounts?.[termIndex] || 0), 0);
              return `<h3 style="margin:16px 0 8px;font-size:14px;color:var(--ff-text);">${escapeHtml(term)} (Total: ${money(total)})</h3><div class="ff-table-wrap"><table style="font-size:13px;"><thead><tr><th>Fee item</th><th>Category</th><th style="text-align:right;">Amount</th></tr></thead><tbody>${rows || '<tr><td colspan="3">No fee items configured.</td></tr>'}</tbody></table></div>`;
            }).join("");

            return `
              <div class="ff-card" style="border:1.5px solid var(--ff-border);border-radius:12px;">

    async function makePayment() {
      const studentId = document.getElementById("paymentStudent").value;
      const amount = Number(document.getElementById("paymentAmount").value);
      const phone = normalizeKenyanPhone(document.getElementById("paymentPhone").value.trim());
      if (!studentId || !(amount > 0)) { alert("Choose a student and enter a valid amount."); return; }
      if (!Number.isInteger(amount)) { alert("Enter a whole amount in KES (M-Pesa does not accept cents)."); return; }
      if (!phone) { alert("Enter a valid Safaricom number, e.g. 07XX XXX XXX or 7XX XXX XXX."); return; }
      const student = children.find(item => item.id === studentId);
      if (!student) return;
      if (Number(student.balance) <= 0) { alert(student.name + " has no balance to pay."); return; }
      if (amount > Number(student.balance)) { alert("The payment amount cannot exceed the remaining balance of " + money(student.balance) + "."); return; }
      setPayState(true, "Sending…");
      showPayNotice("Sending the payment request to M-Pesa…");
      try {
        const { data, error } = await sb.functions.invoke('fee-api', { body: { action: 'stk_push', student_id: studentId, amount, phone } });
        if (error) {
          const status = error.context && error.context.status;
          const howToPay = `Please pay from your M-Pesa menu: Paybill ${school.paybill || "(ask the school)"}, account number ${student.adm}.`;
          // 404 = function missing, 409/503 = the school has not set up M-Pesa yet: either way give the manual way to pay
          throw Object.assign(new Error(status === 404
            ? `Online payment is not available yet. ${howToPay}`
            : (status === 409 || status === 503) ? `${await fnErrorMessage(error)} ${howToPay}`
            : await fnErrorMessage(error)), { handled: true });
        }
        if (!data || !data.payment_id) throw Object.assign(new Error("The payment service did not respond properly. Please try again."), { handled: true });
        showPayNotice(`${ico('phone')} <strong>Check your phone.</strong> Enter your M-Pesa PIN to pay <strong>${escapeHtml(money(amount))}</strong> for ${escapeHtml(student.name)}. Do not close this window.`);
        setPayState(true, "Waiting for M-Pesa…");
        waitForPayment(data.payment_id, student);
      } catch (e) {
        showPayNotice(escapeHtml(e.handled ? e.message : FF.friendlyError(e)), "error");
        setPayState(false);
      }
    }
    function waitForPayment(paymentId, student) {
      let tries = 0;
      clearInterval(payPollTimer);
      payPollTimer = setInterval(async () => {
        tries += 1;
        const { data } = await sb.from('payments').select('status, receipt_no, mpesa_receipt, result_desc').eq('id', paymentId).maybeSingle();
        if (data && data.status === 'completed') {
          clearInterval(payPollTimer);
          showPayNotice(`${ico('checkCircle')} <strong>Payment confirmed.</strong> Receipt ${escapeHtml(data.receipt_no || data.mpesa_receipt || "")}.`, "success");
          await refresh();
          setTimeout(() => { closeModal("paymentModal"); showView("payments"); }, 1200);
          setPayState(false);
        } else if (data && ["failed", "cancelled", "timeout"].includes(data.status)) {
          clearInterval(payPollTimer);
          showPayNotice(escapeHtml(data.result_desc || (data.status === "cancelled" ? "The payment was cancelled on your phone." : "The payment did not go through.")) + " You have not been charged. You can try again.", "error");
          setPayState(false);
        } else if (tries >= PAY_POLL_MAX) {
          clearInterval(payPollTimer);
          showPayNotice("We have not received confirmation yet. If M-Pesa has taken the money, it will appear under Payments shortly. <strong>Please do not pay again.</strong>");
          setPayState(false);
          refresh();
        }
      }, PAY_POLL_MS);
    }

    function downloadAllReceipts() {
      const blob = new Blob([receiptsHtml(payments)], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `FeeFlow-Receipts-${Date.now()}.html`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function printReceipt(paymentId) {

      if (!payment || payment.rawStatus !== 'completed') return;     // only confirmed payments have receipts
      const printWindow = window.open("", "_blank", "width=760,height=820");
      if (!printWindow) { alert("Please allow pop-ups to print your receipt."); return; }
      printWindow.document.write(receiptsHtml([payment]));
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }

    function downloadReceipt(paymentId) {
      const payment = payments.find(item => item.id === paymentId);
      if (!payment || payment.rawStatus !== 'completed') return;     // only confirmed payments have receipts

      const blob = new Blob([receiptsHtml([payment])], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `FeeFlow-Receipt-${payment.ref || payment.id}.html`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // (called by the old page but never defined, so deleting a notification used to crash)
    async function deleteNotification(notificationId) {
      const record = notifications.find(item => String(item.id) === String(notificationId));
      if (!record) return;
      const { error } = await sb.from('notifications').delete().eq('id', record.id);
      if (error) { toast(FF.friendlyError(error)); return; }
      notifications = notifications.filter(item => item !== record);
      renderNotifications();
      updateNotificationBadge();
    }

    async function markAllRead() {
      const { error } = await sb.from('notifications').update({ unread: false }).eq('audience', 'parent').eq('parent_id', parent.id).eq('unread', true);
      if (error) { toast(FF.friendlyError(error)); return; }
      notifications.forEach(item => { item.unread = false; });
      renderNotifications();
      updateNotificationBadge();
    }

    async function saveProfile() {
      const name = document.getElementById("profileName").value.trim();
      const email = document.getElementById("profileEmail").value.trim();
      if (name.length < 2) { alert("Enter your full name."); return; }
      if (!/^\S+@\S+\.\S+$/.test(email)) { alert("Enter a valid email address."); return; }
      const { error } = await sb.from('parents').update({ full_name: name, email }).eq('id', parent.id);
      if (error) { alert(FF.friendlyError(error)); return; }
      parent.name = name; parent.full_name = name; parent.email = email;
      renderShell(); renderAllViews(); showView("profile");
      alert("Profile updated successfully.");
    }
    async function changePassword() {
      const pw = document.getElementById("newPassword").value, pw2 = document.getElementById("newPassword2").value;
      if (pw.length < 8) { alert("Your password must be at least 8 characters."); return; }
      if (pw !== pw2) { alert("The two passwords do not match."); return; }
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) { alert(FF.friendlyError(error)); return; }
      document.getElementById("newPassword").value = ""; document.getElementById("newPassword2").value = "";
      alert("Password changed.");
    }

    function requestLogout() {
      if (confirm("Log out of your FeeFlow parent account?")) logout();
    }

    function logout() {
      clearInterval(payPollTimer);
      FF.signOut();
    }

    async function switchAccount() {
      const ids = allParents.map(x => x.school_id);
      const { data } = await sb.from('schools').select('id, name').in('id', ids);
      const names = Object.fromEntries((data || []).map(x => [x.id, x.name]));
      document.getElementById("app").innerHTML = `
        <div class="ff-empty"><div class="ff-card">
          <div class="ff-empty-icon">${ico('school')}</div>
          <h1 style="margin-top:12px">Choose a school</h1>
          <p class="ff-page-desc" style="margin-bottom:18px">You are registered at more than one school.</p>
          ${allParents.map(x => `<button class="ff-btn ff-btn-outline" style="width:100%;margin-top:9px" onclick="selectParent('${escapeHtml(x.id)}')">${escapeHtml(names[x.school_id] || 'School')}</button>`).join("")}
        </div></div>`;
    }
    async function selectParent(parentId) {
      const next = allParents.find(x => x.id === parentId);
      if (!next) return;
      safeStorage.setItem('ff_parent_active', next.id);
      parent = next; parent.name = next.full_name;
      try { await loadSchoolData(); renderShell(); renderAllViews(); subscribeRealtime(); }
      catch (e) { renderMessagePage('Unable to load this school', FF.friendlyError(e)); }
    }

    document.addEventListener("change", event => {
      if (event.target && event.target.id === "paymentStudent") {
        updatePaymentAmountHint();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Enter" || event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
      const modal = document.getElementById("paymentModal");
      if (modal?.classList.contains("open") && modal.contains(event.target)) {
        event.preventDefault();
        makePayment();
      }
    });

    document.addEventListener("DOMContentLoaded", () => { setParentSidebarMode(currentParentSidebarMode); setTimeout(initParentAutoSuggestAndSearchableSelects, 100); setupParentSidebarResizer();
      document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
        backdrop.addEventListener("click", event => {
          if (event.target === backdrop) backdrop.classList.remove("open");
        });
      });
    });

    window.addEventListener("error", event => { console.error(event.error || event.message); });
    function bootParentPortal() {
      initialize().catch(error => {
        console.error(error);
        const which = error && error.feeflowQuery;
        const label = which ? (QUERY_LABELS[which] || which) : 'your dashboard';
        if (document.getElementById("app")) {
          renderMessagePage('Unable to load ' + label, describeQueryError(error),
            which ? 'Failed while reading: ' + which + '.' : '');
        }
      });
    }
    bootParentPortal();
  </script>
  <script>
    // Register the service worker so the app opens offline and can be installed on a phone.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          // a waiting worker means a new version is ready: swap it in on the next navigation
          if (reg.waiting && navigator.serviceWorker.controller) reg.waiting.postMessage('skip-waiting');
        }).catch(function () { /* offline-first is a bonus, not a requirement */ });
      });
      var refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (refreshing) return; refreshing = true;
      });
    }
  </script>
</body>
