<!DOCTYPE html>
<html lang="en">
<head>
    

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FeeFlow — Parent Portal</title>
  <style>
    :root {
      --navy: #0c2d57;
      --blue: #1768b2;
      --green: #059669;
      --mint: #10b981;
      --page: #f1f5f9;
      --white: #ffffff;
      --line: #e2e8f0;
      --text: #172033;
      --muted: #64748b;
      --danger: #dc2626;
      --warning: #d97706;
      --sidebar-width: 305px;
      --topbar-height: 78px;
      --radius: 16px;
      --shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--page);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: var(--sidebar-width);
      background: var(--white);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      z-index: 30;
    }

    .brand {
      min-height: 122px;
      padding: 28px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: flex-start;
      gap: 13px;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, var(--navy), var(--green));
      display: grid;
      place-items: center;
      font-size: 24px;
      flex: 0 0 auto;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 3px;
    }

    .brand-tag {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 9px;
      border-radius: 5px;
      color: var(--green);
      background: #ecfdf5;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .navigation {
      padding: 24px 14px;
      flex: 1;
    }

    .nav-label {
      margin: 0 10px 13px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .nav-button {
      width: 100%;
      border: 0;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 12px 13px;
      margin-bottom: 4px;
      text-align: left;
      font-size: 16px;
      font-weight: 500;
    }

    .nav-button:hover {
      color: var(--text);
      background: #f8fafc;
    }

    .nav-button.active {
      color: var(--navy);
      background: #eff6ff;
      font-weight: 700;
    }

    .nav-icon {
      width: 22px;
      text-align: center;
      font-size: 18px;
    }

    .nav-count {
      margin-left: auto;
      min-width: 21px;
      height: 21px;
      padding: 0 6px;
      border-radius: 11px;
      background: var(--danger);
      color: white;
      display: none;
      place-items: center;
      font-size: 11px;
      font-weight: 800;
    }

    .nav-count.show {
      display: grid;
    }

    .sidebar-footer {
      padding: 16px;
    }

    .account-card {
      padding: 15px 14px;
      border-radius: 12px;
      background: var(--page);
      margin-bottom: 14px;
    }

    .account-name {
      font-weight: 800;
      font-size: 15px;
    }

    .account-school {
      color: var(--muted);
      font-size: 12px;
      margin-top: 7px;
    }

    .logout-button {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      color: var(--text);
      font-weight: 700;
      text-align: left;
    }

    .main-area {
      margin-left: var(--sidebar-width);
      min-width: 0;
      flex: 1;
    }

    .topbar {
      height: var(--topbar-height);
      background: var(--white);
      border-bottom: 1px solid var(--line);
      padding: 0 30px;
      display: flex;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .breadcrumb {
      color: var(--muted);
      font-size: 14px;
    }

    .breadcrumb strong {
      color: var(--text);
    }

    .content {
      padding: 28px 30px 50px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
      animation: fade-in 0.18s ease-out;
    }

    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .page-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
    }

    .page-title {
      font-size: 29px;
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .page-description {
      color: var(--muted);
      margin-top: 6px;
      font-size: 15px;
    }

    .button {
      border: 0;
      border-radius: 10px;
      padding: 11px 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    .button-primary {
      color: white;
      background: linear-gradient(135deg, var(--navy), var(--blue));
    }

    .button-success {
      color: white;
      background: linear-gradient(135deg, var(--green), var(--mint));
    }

    .button-outline {
      color: var(--text);
      background: white;
      border: 1px solid var(--line);
    }

    .button-danger {
      color: var(--danger);
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--white);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .panel-header {
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 800;
    }

    .panel-body {
      padding: 22px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .stat-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--blue), var(--green));
    }

    .stat-value {
      font-size: 25px;
      font-weight: 800;
    }

    .stat-value.green {
      color: var(--green);
    }

    .stat-value.red {
      color: var(--danger);
    }

    .stat-label {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .notice {
      border: 1px solid #bfdbfe;
      border-radius: 11px;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 14px 16px;
      margin-bottom: 20px;
      line-height: 1.5;
      font-size: 13px;
    }

    .child-card {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .child-card:last-child {
      margin-bottom: 0;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(135deg, var(--blue), var(--green));
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 800;
    }

    .child-name {
      font-size: 17px;
      font-weight: 800;
    }

    .child-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .balance-block {
      text-align: right;
    }

    .balance-value {
      color: var(--green);
      font-weight: 800;
      font-size: 16px;
    }

    .balance-label {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    .empty-state {
      color: var(--muted);
      text-align: center;
      padding: 42px 20px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      padding: 12px 15px;
      text-align: left;
      color: var(--muted);
      background: var(--page);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    td {
      padding: 14px 15px;
      border-top: 1px solid var(--line);
      font-size: 13px;
    }

    .money {
      font-weight: 800;
    }

    .money.green {
      color: var(--green);
    }

    .pill {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 7px;
      color: var(--green);
      background: #ecfdf5;
      font-size: 11px;
      font-weight: 800;
    }

    .receipt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }

    .receipt {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 22px;
      background: #fffefb;
    }

    .receipt-heading {
      text-align: center;
      padding-bottom: 15px;
      border-bottom: 3px double var(--navy);
      margin-bottom: 13px;
    }

    .receipt-school {
      color: var(--navy);
      font-size: 19px;
      font-weight: 800;
    }

    .receipt-title {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px dotted var(--line);
      font-size: 13px;
    }

    .receipt-actions {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .notification {
      padding: 17px 20px;
      border-bottom: 1px solid var(--line);
    }

    .notification:last-child {
      border-bottom: 0;
    }

    .notification.unread {
      background: #f0f9ff;
    }

    .notification-title {
      font-weight: 800;
    }

    .notification-message,
    .notification-time {
      color: var(--muted);
      margin-top: 5px;
      font-size: 13px;
    }

    .notification-time {
      font-size: 11px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .form-input {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid var(--line);
      border-radius: 9px;
      background: white;
      color: var(--text);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(23, 104, 178, 0.1);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 20px;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      background: white;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.25);
    }

    .modal-header {
      padding: 19px 21px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
    }

    .modal-body {
      padding: 21px;
    }

    .modal-footer {
      padding: 15px 21px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      font-size: 24px;
    }

    .access-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .access-card {
      width: 100%;
      max-width: 470px;
      padding: 30px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      text-align: center;
    }

    @media (max-width: 900px) {
      :root {
        --sidebar-width: 270px;
      }

      .stats-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 720px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .main-area {
        margin-left: 0;
      }

      .mobile-menu {
        display: block;
        margin-right: 12px;
      }

      .content {
        padding: 22px 16px 40px;
      }

      .topbar { padding: 0 16px; }
      .desktop-status { display:none; }
      .topbar .button { padding:8px 10px !important; }

      .page-heading {
        flex-direction: column;
      }

      .child-card {
        grid-template-columns: auto 1fr;
      }

      .balance-block {
        grid-column: 2;
        text-align: left;
      }
    }
  
      /* Sidebar Width & Collapse Controls */
      body.sidebar-narrow { --sidebar-width: 180px; }
      body.sidebar-standard { --sidebar-width: 250px; }
      body.sidebar-wide { --sidebar-width: 310px; }
      body.sidebar-compact { --sidebar-width: 68px; }
      body.sidebar-closed { --sidebar-width: 0px; }
      .sidebar { transition: width 0.25s ease, transform 0.25s ease; overflow-x: hidden; width: var(--sidebar-width, 250px); }
      body.sidebar-compact .nav-button span, body.sidebar-compact .brand-subtitle, body.sidebar-compact .brand-badge, body.sidebar-compact .user-meta { display: none !important; }
      body.sidebar-compact .nav-button { justify-content: center; padding: 12px 0; }
      body.sidebar-compact .nav-button i { font-size: 18px; margin: 0; }
      body.sidebar-closed .sidebar { transform: translateX(-100%); }
      body.sidebar-closed .main-content { margin-left: 0; }

      /* Auto-Suggest styling */
      .auto-suggest-wrapper { position: relative; width: 100%; }
      .auto-suggest-popup {
          position: absolute; top: 100%; left: 0; right: 0; max-height: 220px; overflow-y: auto;
          background: var(--paper); border: 1.5px solid var(--green); border-radius: 8px;
          box-shadow: 0 10px 28px rgba(0,0,0,0.18); z-index: 99999; display: none;
      }
      .auto-suggest-item { padding: 9px 12px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--line); transition: background 0.15s; color: var(--ink); }
      .auto-suggest-item:hover { background: #ecfdf5; color: var(--green); font-weight: 600; }

    
      /* Mouse Draggable Resizer & Sidebar Controls */
      .sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-width, 250px); transition: transform 0.25s ease; z-index: 100; display: flex; flex-direction: column; background: var(--paper); border-right: 1px solid var(--line); }
      .sidebar-resizer {
          position: absolute; top: 0; right: -5px; bottom: 0; width: 10px; cursor: col-resize; z-index: 101; background: transparent; transition: background 0.15s;
      }
      .sidebar-resizer:hover, .sidebar-resizer.resizing { background: var(--green, #059669); }
      body.sidebar-closed .sidebar { transform: translateX(-100%); }
      body.sidebar-closed .main-content { margin-left: 0 !important; }
      .main-content { transition: margin-left 0.25s ease; margin-left: var(--sidebar-width, 250px); }

    </style>
</head>
<body>
  <div id="app"></div>

  <div class="modal-backdrop" id="childModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Link a Child</div>
        <button class="button button-outline" onclick="closeModal('childModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="childName">Child's full name</label>
          <input class="form-input" id="childName" placeholder="Enter full name">
        </div>
        <div class="form-group">
          <label class="form-label" for="childAdm">Admission number</label>
          <input class="form-input" id="childAdm" placeholder="Enter admission number">
        </div>
        <div class="form-group">
          <label class="form-label" for="childClass">Class / grade / form</label>
          <select class="form-input" id="childClass">
            <option value="">Select class</option>
            <option>PP1</option><option>PP2</option>
            <option>Class 1</option><option>Class 2</option><option>Class 3</option><option>Class 4</option>
            <option>Class 5</option><option>Class 6</option><option>Class 7</option><option>Class 8</option>
            <option>Form 1</option><option>Form 2</option><option>Form 3</option><option>Form 4</option>
          </select>
          <div style="font-size:12px;color:var(--muted);margin-top:6px;">Enter the details exactly as the school has them. The school confirms every request before you can see fees.</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="button button-outline" onclick="closeModal('childModal')">Cancel</button>
        <button class="button button-primary" onclick="saveChild()" id="addChildButton">Request Link</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="paymentModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Pay School Fees (M-Pesa)</div>
        <button class="button button-outline" onclick="closeModal('paymentModal')">✕</button>
      </div>
      <div class="modal-body">
        <div class="notice" id="paybillNotice"></div>
        <div class="form-group">
          <label class="form-label" for="paymentStudent">Student</label>
          <select class="form-input" id="paymentStudent" onchange="updatePaymentAmountHint()"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="paymentAmount">Amount (KES)</label>
          <input class="form-input" id="paymentAmount" type="number" min="1" onkeydown="if(event.key==='Enter'){event.preventDefault();makePayment()}" autocomplete="off">
        </div>
        <div class="form-group">
          <label class="form-label" for="paymentPhone">M-Pesa phone number</label>
          <input class="form-input" id="paymentPhone" type="tel" placeholder="7XX XXX XXX" onkeydown="if(event.key==='Enter'){event.preventDefault();makePayment()}" autocomplete="tel-national">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="button button-outline" onclick="closeModal('paymentModal')">Cancel</button>
        <button type="button" class="button button-success" id="payButton" onclick="makePayment()">Send STK Push</button>
      </div>
    </div>
  </div>

  
  <div class="modal-backdrop" id="childDetailsModal">
    <div class="modal" style="max-width:680px;width:95%;">
      <div class="modal-header">
        <div class="modal-title" id="childModalTitle">Student Details & Fee Profile</div>
        <button class="button button-outline" onclick="closeModal('childDetailsModal')">✕</button>
      </div>
      <div class="modal-body" id="childModalBody" style="max-height:70vh;overflow-y:auto;padding:20px;">
      </div>
      <div class="modal-footer">
        <button class="button button-outline" onclick="closeModal('childDetailsModal')">Close</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-notifPreview">
    <div class="modal" style="max-width:540px;width:95%;">
      <div class="modal-header">
        <div class="modal-title" id="parentNotifTitle"><i class="fas fa-bell" style="color:var(--gold);"></i> Notification Details</div>
        <button class="button button-outline" onclick="closeModal('modal-notifPreview')">✕</button>
      </div>
      <div class="modal-body" id="parentNotifBody" style="font-size:13.5px;line-height:1.6;color:var(--charcoal);padding:20px;"></div>
      <div class="modal-footer" style="display:flex;justify-content:space-between;align-items:center;">
        <button class="button button-outline" style="color:var(--danger);border-color:var(--danger);" onclick="deleteParentNotifFromPreview()">✕ Delete Notification</button>
        <button class="button button-outline" onclick="closeModal('modal-notifPreview')">Close</button>
      </div>
    </div>
  </div>

  <script src="js/vendor/supabase-2.117.2.js"></script>
  <script src="js/config.js"></script>
  <script src="js/ff-client.js"></script>
  <script>
    'use strict';
    if (!window.FF) { document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;text-align:center;">FeeFlow could not load. Check your internet connection and refresh the page.</div>'; throw new Error('FeeFlow client failed to load'); }
    // Only harmless display preferences (sidebar width, hidden report cards) stay on this device.
    const safeStorage = {
      getItem(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      setItem(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* ignore */ } },
      removeItem(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
    };
    let session = null;
    let parent = null;
    let school = null;
    let children = [];
    let payments = [];
    let notifications = [];
    let receiptViewMode = 'list';
    let receiptSearchQuery = '';
    let receiptSortMode = 'date-desc';
    let reportViewMode = 'list';
    let hiddenReports = (() => { try { const v = JSON.parse(safeStorage.getItem('ff_hidden_reports') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } })();
    let activeEditingChildId = null;

    function fmtDate(v) { return v ? new Date(v).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'; }
    function fmtDateTime(v) {
      if (!v) return '—';

    }
    function timeAgo(iso) {
      if (!iso) return 'Recently';
      const sec = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
      if (sec < 60) return 'Just now';
      if (sec < 3600) return Math.floor(sec / 60) + ' min ago';
      if (sec < 86400) return Math.floor(sec / 3600) + ' hr ago';
      if (sec < 172800) return 'Yesterday';
      return fmtDate(iso);
    }

    async function loadSchoolData() {
      const pid = parent.id, sid = parent.school_id;
      const [schoolR, kidsR, payR, notifR, linksR, pubR, termsR] = await Promise.all([
        sb.from('schools').select('id, name, location, paybill, address, phone').eq('id', sid).maybeSingle(),
        sb.from('student_balances').select('*').eq('school_id', sid).order('full_name'),
        sb.from('payments').select('id, student_id, amount, method, status, mpesa_receipt, receipt_no, note, created_at, completed_at').order('created_at', { ascending: false }).limit(500),
        sb.from('notifications').select('id, title, body, unread, created_at, type').eq('audience', 'parent').eq('parent_id', pid).order('created_at', { ascending: false }).limit(100),
        sb.from('parent_students').select('student_id, status').eq('parent_id', pid),
        sb.from('fee_structure_published').select('data, term_names, published_at').eq('school_id', sid).maybeSingle(),
        sb.from('terms').select('name, start_date, end_date, deadline, status').eq('school_id', sid).order('start_date', { ascending: false })
      ]);
      const failed = [schoolR, kidsR, payR, notifR, linksR, pubR, termsR].find(r => r.error);
      if (failed) throw failed.error;
      school = schoolR.data || { id: sid, name: 'School', paybill: '' };
      children = (kidsR.data || []).filter(r => r.active).map(r => ({
        id: r.id, name: r.full_name, adm: r.admission_no, class: r.class_name, boarding: !!r.boarding,
        total: Number(r.total_due || 0), paid: Number(r.paid || 0), balance: Number(r.balance || 0), noFee: r.fee_status === 'no_fee',
        status: r.fee_status, initials: initials(r.full_name), color: colorFor(r.id)
      }));
      const byId = Object.fromEntries(children.map(c => [c.id, c]));
      const STATUS = { completed: 'Paid', pending: 'Pending', failed: 'Failed', cancelled: 'Failed', timeout: 'Failed' };
      payments = (payR.data || []).filter(x => byId[x.student_id]).map(x => ({
        id: x.id, studentId: x.student_id, studentName: byId[x.student_id].name, class: byId[x.student_id].class, adm: byId[x.student_id].adm,
        amount: Number(x.amount), method: /mpesa/.test(x.method) ? 'M-Pesa' : cap(x.method), status: STATUS[x.status] || x.status, rawStatus: x.status,
        ref: x.mpesa_receipt || x.receipt_no || (x.status === 'pending' ? 'Awaiting confirmation' : '—'), receiptNo: x.receipt_no || '', mpesaCode: x.mpesa_receipt || '',
        date: fmtDateTime(x.completed_at || x.created_at), paybill: school.paybill
      }));
      notifications = (notifR.data || []).map(n => ({ ...n, time: timeAgo(n.created_at) }));
      const links = linksR.data || [];
      pendingCount = links.filter(l => l.status === 'pending').length;
      rejectedCount = links.filter(l => l.status === 'rejected').length;
      published = pubR.data && pubR.data.data && Array.isArray(pubR.data.data.levels) ? pubR.data : null;
      terms = termsR.data || [];
    }
    const cap = (t) => String(t || '').charAt(0).toUpperCase() + String(t || '').slice(1);

    async function refresh() {
      try { await loadSchoolData(); renderAllViews(); } catch (e) { console.error(e); }
    }
    function subscribeRealtime() {                               // new payments / notices show up without refreshing
      if (!sb.channel) return;
      try {
        if (realtimeChannel && sb.removeChannel) sb.removeChannel(realtimeChannel);
        const reload = () => { clearTimeout(reloadTimer); reloadTimer = setTimeout(refresh, 800); };
        realtimeChannel = sb.channel('parent-' + parent.id)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'payments' }, reload)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications', filter: 'parent_id=eq.' + parent.id }, reload)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'parent_students', filter: 'parent_id=eq.' + parent.id }, reload)
          .subscribe();
      } catch (e) { /* live updates are optional */ }
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[character]));
    }

    function money(value) {
      return "KES " + Number(value || 0).toLocaleString("en-KE");
    }

    // Accepts 07XXXXXXXX, 01XXXXXXXX, 7XXXXXXXX, 2547XXXXXXXX, +2547XXXXXXXX
    // Returns the normalized 2547XXXXXXXX / 2541XXXXXXXX format M-Pesa expects, or null if invalid.
    function normalizeKenyanPhone(raw) {
      const digits = String(raw || "").replace(/\D/g, "");
      if (/^254(7|1)\d{8}$/.test(digits)) return digits;
      if (/^0(7|1)\d{8}$/.test(digits)) return "254" + digits.slice(1);
      if (/^(7|1)\d{8}$/.test(digits)) return "254" + digits;
      return null;
    }

function setupParentSidebarResizer() {
    const sidebar = document.querySelector('.sidebar');
    const resizer = document.querySelector('.sidebar-resizer');
    if (!sidebar || !resizer) return;

    let isResizing = false;
    resizer.addEventListener('mousedown', function(e) {
        isResizing = true;
        resizer.classList.add('resizing');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        e.preventDefault();
    });

    document.addEventListener('mousemove', function(e) {
        if (!isResizing) return;
        let newWidth = e.clientX;
        if (newWidth < 70) {
            document.body.classList.add('sidebar-closed');
            const main = document.querySelector('.main-content');
            if (main) main.style.marginLeft = '0px';
            return;
        } else {
            document.body.classList.remove('sidebar-closed');
        }
        if (newWidth < 160) newWidth = 160;
        if (newWidth > 480) newWidth = 480;
        
        document.documentElement.style.setProperty('--sidebar-width', newWidth + 'px');
        const main = document.querySelector('.main-content');
        if (main) main.style.marginLeft = newWidth + 'px';
    });

    document.addEventListener('mouseup', function() {
        if (isResizing) {
            isResizing = false;
            resizer.classList.remove('resizing');
            document.body.style.cursor = '';
            document.body.style.userSelect = '';
            const currentWidth = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 250;
            safeStorage.setItem('ff_custom_parent_sidebar_width', String(currentWidth));
            safeStorage.setItem('ff_parent_sidebar_closed', 'false');
        }
    });

    // Load saved width
    const savedWidth = safeStorage.getItem('ff_custom_parent_sidebar_width');
    const savedState = safeStorage.getItem('ff_parent_sidebar_closed');
    if (savedWidth && !isNaN(savedWidth)) {
        const w = Number(savedWidth);
        document.documentElement.style.setProperty('--sidebar-width', w + 'px');
        const main = document.querySelector('.main-content');
        if (main && savedState !== 'true') main.style.marginLeft = w + 'px';
    }
    if (savedState === 'true') {
        document.body.classList.add('sidebar-closed');
        const main = document.querySelector('.main-content');
        if (main) main.style.marginLeft = '0px';
    }
}

function toggleParentSidebarState() {
    const isClosed = document.body.classList.contains('sidebar-closed');
    const main = document.querySelector('.main-content');
    const w = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--sidebar-width')) || 250;
    if (isClosed) {
        document.body.classList.remove('sidebar-closed');
        if (main) main.style.marginLeft = w + 'px';
        safeStorage.setItem('ff_parent_sidebar_closed', 'false');
    } else {
        document.body.classList.add('sidebar-closed');
        if (main) main.style.marginLeft = '0px';
        safeStorage.setItem('ff_parent_sidebar_closed', 'true');
    }
}

function initParentAutoSuggestAndSearchableSelects() {
    const select = document.getElementById('paymentStudent');
    if (select && !select.dataset.autoSuggestInit) {
        select.dataset.autoSuggestInit = 'true';
        select.style.display = 'none';

        const wrapper = document.createElement('div');
        wrapper.className = 'auto-suggest-wrapper';
        wrapper.style.cssText = 'position:relative;width:100%;flex:1;';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'form-input auto-suggest-input';
        input.placeholder = '🔍 Search child to pay for...';
        input.style.cssText = 'width:100%;';
        
        const popup = document.createElement('div');
        popup.className = 'auto-suggest-popup';
        popup.style.cssText = 'position:absolute;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:var(--paper);border:1.5px solid var(--green);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,0.18);z-index:99999;display:none;';

        wrapper.appendChild(input);
        wrapper.appendChild(popup);
        select.parentNode.insertBefore(wrapper, select);

        function updateList() {
            const q = input.value.trim().toLowerCase();
            const options = Array.from(select.options).filter(o => o.value !== '');
            const matches = options.filter(o => !q || o.text.toLowerCase().includes(q));
            
            if (!matches.length) {
                popup.innerHTML = '<div style="padding:10px 12px;color:var(--muted);font-size:12px;">No matching children found.</div>';
            } else {
                popup.innerHTML = matches.map(o => `
                    <div class="auto-suggest-item" data-value="${o.value}" style="padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line);transition:background 0.15s;color:var(--ink);">
                        <i class="fas fa-user-graduate" style="margin-right:6px;color:var(--green);"></i> ${escapeHtml(o.text)}
                    </div>
                `).join('');
            }
            popup.style.display = 'block';
        }

        input.addEventListener('focus', updateList);
        input.addEventListener('input', updateList);

        popup.addEventListener('click', e => {
            const item = e.target.closest('.auto-suggest-item');
            if (!item) return;
            const val = item.dataset.value;
            select.value = val;
            input.value = item.textContent.trim().replace(/^.*?\s+/, '');
            popup.style.display = 'none';
            select.dispatchEvent(new Event('change'));
        });

        document.addEventListener('click', e => {
            if (!wrapper.contains(e.target)) popup.style.display = 'none';
        });

        select.addEventListener('change', () => {
            const opt = select.options[select.selectedIndex];
            if (opt && opt.value) input.value = opt.text;
            else input.value = '';
        });
    }
}

    function initials(name) {

        .split(/\s+/)
        .filter(Boolean)
        .map(part => part[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();
    }

      return `

    // (these two were called but never defined in the old page, so printing a receipt used to crash)
    function receiptHtml(payment) {
      const e = escapeHtml, line = (k, v) => `<tr><td style="color:#64748b;padding:6px 0;">${e(k)}</td><td style="text-align:right;font-weight:600;padding:6px 0;">${e(v)}</td></tr>`;
      return `<div style="font-family:Arial,sans-serif;max-width:560px;margin:30px auto;padding:30px;border:2px solid #0c2d57;border-radius:10px;page-break-inside:avoid;">

          <div style="font-size:20px;font-weight:800;color:#0c2d57;">${e(school.name || 'School')}</div>

    function receiptsHtml(list) {
      const body = list.filter(x => x.rawStatus === 'completed').map(receiptHtml).join('');
      return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>FeeFlow receipts</title></head><body style="margin:0">${body || '<p style="font-family:Arial;padding:30px;">No confirmed payments yet.</p>'}</body></html>`;

    function normalizeGrade(value) {
      return String(value || "")
        .replace(/[A-Z]$/, "")
        .replace(/^Class /i, "Grade ")
        .trim()
        .toLowerCase();
    }

    function findPublishedGrade(publication, child) {
      for (const level of publication?.levels || []) {
        const grade = (level.grades || []).find(item => normalizeGrade(item.name) === normalizeGrade(child.class));
        if (grade) return { level: level.name, grade };
      }
      return null;
    }

    function setOtpNotice(text, tone) {
      const box = document.getElementById("otpNotice"); if (!box) return;
      box.textContent = text;
      box.style.color = tone === "error" ? "#b91c1c" : tone === "success" ? "#047857" : "var(--muted)";
    }
    async function requestPhoneCode() {
      const sendBtn = document.getElementById("otpSendButton"), resendBtn = document.getElementById("otpResendButton");
      [sendBtn, resendBtn].forEach(b => { if (b) b.disabled = true; });
      setOtpNotice("Sending the code…");
      try {
        const { data, error } = await sb.functions.invoke('fee-api', { body: { action: 'otp_request', parent_id: parent.id } });
        if (error) throw new Error(await fnErrorMessage(error));
        document.getElementById("otpStep1").style.display = "none";
        document.getElementById("otpStep2").style.display = "";
        setOtpNotice(`Code sent to ${(data && data.sent_to) || "your phone"}. It expires in 10 minutes. Do not share it with anyone.`, "success");
        const input = document.getElementById("otpCode"); if (input) input.focus();
      } catch (e) { setOtpNotice(e.message || "Could not send the code. Please try again.", "error"); }
      finally { [sendBtn, resendBtn].forEach(b => { if (b) b.disabled = false; }); }
    }
    async function verifyPhoneCode() {
      const code = (document.getElementById("otpCode").value || "").trim();
      if (!/^\d{6}$/.test(code)) { setOtpNotice("Enter the 6-digit code from the SMS.", "error"); return; }
      const btn = document.getElementById("otpVerifyButton"); btn.disabled = true;
      try {
        const { data, error } = await sb.functions.invoke('fee-api', { body: { action: 'otp_verify', parent_id: parent.id, code } });
        if (error) throw new Error(await fnErrorMessage(error));
        parent.phone_verified = true;
        const n = Number(data && data.approved) || 0;
        await refresh();                         // pending child links the school had not approved yet may now be active
        renderProfile();
        setOtpNotice(`Phone verified.${n ? ` ${n} child link${n === 1 ? "" : "s"} approved.` : ""}`, "success");
      } catch (e) { setOtpNotice(e.message || "Could not verify the code.", "error"); btn.disabled = false; }
    }

    function renderProfile() {
      document.getElementById("view-profile").innerHTML = `

          <div>

            <p class="page-description">Manage your parent account</p>

        <div class="panel">
          <div class="panel-header">Account Information</div>
          <div class="panel-body">
            <div class="form-grid">
              <div class="form-group">
                <label class="form-label" for="profileName">Full name</label>
                <input class="form-input" id="profileName" value="${escapeHtml(parent.name)}" maxlength="80">
              </div>
              <div class="form-group">
                <label class="form-label" for="profilePhone">Phone number</label>
                <input class="form-input" id="profilePhone" value="+${escapeHtml(parent.phone || "")}" disabled>
                <div style="font-size:11px;color:var(--muted);margin-top:4px;">Your phone number links you to your children. To change it, please contact the school.</div>
              </div>
              <div class="form-group full">
                <label class="form-label" for="profileEmail">Contact email</label>
                <input class="form-input" id="profileEmail" type="email" value="${escapeHtml(parent.email || "")}">
                <div style="font-size:11px;color:var(--muted);margin-top:4px;">Sign-in email: ${escapeHtml(loginEmail)}</div>
              </div>
              <div class="form-group full">
                <label class="form-label">School</label>
                <input class="form-input" value="${escapeHtml(school.name || "School")}" disabled>
              </div>
            </div>
            <button class="button button-primary" onclick="saveProfile()" id="saveProfileButton">Save Profile</button>
          </div>
        </div>
        ${parent.phone_verified ? `
        <div class="panel" style="margin-top:20px;" id="phoneVerifyPanel">
          <div class="panel-header">Phone verification</div>
          <div class="panel-body"><p style="margin:0;font-size:13px;color:var(--muted);">✓ Your phone number is verified. Children registered under this number are approved automatically.</p>
            <div id="otpNotice" style="font-size:13px;margin-top:10px;" role="status"></div></div>
        </div>` : `
        <div class="panel" style="margin-top:20px;" id="phoneVerifyPanel">
          <div class="panel-header">Verify your phone number</div>
          <div class="panel-body">
            <p style="margin:0 0 12px;font-size:13px;color:var(--muted);">We will text a 6-digit code to +${escapeHtml(parent.phone || "")}. Once verified, children registered under this number are approved straight away, without waiting for the school.</p>
            <div id="otpStep1"><button class="button button-primary" id="otpSendButton" onclick="requestPhoneCode()">Send code by SMS</button></div>
            <div id="otpStep2" style="display:none;">
              <div class="form-group"><label class="form-label" for="otpCode">6-digit code</label>
                <input class="form-input" id="otpCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="123456"></div>
              <button class="button button-primary" id="otpVerifyButton" onclick="verifyPhoneCode()">Verify</button>
              <button class="button button-outline" id="otpResendButton" onclick="requestPhoneCode()" style="margin-left:8px;">Send a new code</button>
            </div>
            <div id="otpNotice" style="font-size:13px;margin-top:10px;" role="status"></div>
          </div>
        </div>`}
        <div class="panel" style="margin-top:20px;">
          <div class="panel-header">Change Password</div>
          <div class="panel-body">
            <div class="form-grid">
              <div class="form-group"><label class="form-label" for="newPassword">New password</label><input class="form-input" id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters"></div>
              <div class="form-group"><label class="form-label" for="newPassword2">Confirm new password</label><input class="form-input" id="newPassword2" type="password" autocomplete="new-password" placeholder="Repeat password"></div>
            </div>
            <button class="button button-primary" onclick="changePassword()">Change Password</button>
          </div>
        </div>
      `;
    }
  

    function updateNotificationBadge() {
      const badge = document.getElementById("notificationCount");
      if (!badge) return;

      const unread = notifications.filter(item => item.unread).length;
      badge.textContent = unread;
      badge.classList.toggle("show", unread > 0);
    }

    function navigate(page, button) {
      document.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
      document.querySelectorAll(".nav-button").forEach(item => item.classList.remove("active"));

      document.getElementById("view-" + page).classList.add("active");
      button.classList.add("active");
      document.getElementById("breadcrumb").textContent = button.textContent.trim();

      if (window.innerWidth <= 720) {
        document.getElementById("sidebar").classList.remove("open");
      }
    }

    function toggleSidebar() {
      document.getElementById("sidebar").classList.toggle("open");
    }

    function openModal(id) {
      document.getElementById(id).classList.add("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    async function saveChild() {
      const name = document.getElementById("childName").value.trim();
      const adm = document.getElementById("childAdm").value.trim();
      const childClass = document.getElementById("childClass").value.trim();
      if (name.length < 2 || !adm || !childClass) { alert("Complete all child details."); return; }
      const button = document.getElementById("addChildButton");
      button.disabled = true;
      try {
        const { data: status, error } = await sb.rpc('claim_child', { p_parent_id: parent.id, p_admission_no: adm, p_child_name: name, p_class: childClass, p_gender: null });
        if (error) throw error;
        document.getElementById("childName").value = ""; document.getElementById("childAdm").value = ""; document.getElementById("childClass").value = "";
        closeModal("childModal");
        await refresh();
        showView("children");
        alert(status === 'active' ? `${name} is now linked to your account.` : `Request sent. ${school.name || 'The school'} will review it, and ${name} will appear here once approved.`);
      } catch (e) { alert(FF.friendlyError(e)); }
      finally { button.disabled = false; }
    }

    function showView(page) {
      const button = document.querySelector(`[data-page="${page}"]`);
      if (button) navigate(page, button);
    }

    function openPaymentModal() {
      if (!children.length) {
        alert("Link a child (and wait for the school to approve it) before making a payment.");
        return;
      }
      clearInterval(payPollTimer);
      const studentSelect = document.getElementById("paymentStudent");
      studentSelect.innerHTML = children.map(child => `
        <option value="${escapeHtml(child.id)}" data-balance="${Number(child.balance || 0)}">${escapeHtml(child.name)} — Balance ${money(child.balance)}</option>
      `).join("");
      const ph = String(parent.phone || "");
      document.getElementById("paymentPhone").value = ph.startsWith("254") ? "0" + ph.slice(3) : ph;
      document.getElementById("paymentAmount").value = "";
      setPayState(false);
      document.getElementById("paybillNotice").innerHTML = `You can also pay from your M-Pesa menu: Paybill <strong>${escapeHtml(school.paybill || "Not configured")}</strong>, account number = your child's admission number.`;
      updatePaymentAmountHint();
      openModal("paymentModal");
    }
    function setPayState(waiting, label) {
      for (const id of ["paymentStudent", "paymentAmount", "paymentPhone"]) document.getElementById(id).disabled = waiting;
      const button = document.getElementById("payButton");
      button.disabled = waiting;
      button.textContent = waiting ? (label || "Waiting for M-Pesa…") : "Send STK Push";
    }
    function showPayNotice(html, tone) {
      const box = document.getElementById("paybillNotice");
      box.innerHTML = html;
      box.style.background = tone === "error" ? "#fef2f2" : tone === "success" ? "#ecfdf5" : "";
    }

    function updatePaymentAmountHint() {
      const studentSelect = document.getElementById("paymentStudent");
      const amountInput = document.getElementById("paymentAmount");
      if (!studentSelect || !amountInput) return;
      const selected = studentSelect.options[studentSelect.selectedIndex];
      const balance = selected ? Number(selected.dataset.balance || 0) : 0;
      amountInput.placeholder = balance > 0 ? `Up to ${money(balance)}` : "Enter amount";
    }

    async function makePayment() {
      const studentId = document.getElementById("paymentStudent").value;
      const amount = Number(document.getElementById("paymentAmount").value);
      const phone = normalizeKenyanPhone(document.getElementById("paymentPhone").value.trim());
      if (!studentId || !(amount > 0)) { alert("Choose a student and enter a valid amount."); return; }
      if (!Number.isInteger(amount)) { alert("Enter a whole amount in KES (M-Pesa does not accept cents)."); return; }
      if (!phone) { alert("Enter a valid Safaricom number, e.g. 07XX XXX XXX or 7XX XXX XXX."); return; }
      const student = children.find(item => item.id === studentId);
      if (!student) return;
      if (Number(student.balance) <= 0) { alert(student.name + " has no balance to pay."); return; }
      if (amount > Number(student.balance)) { alert("The payment amount cannot exceed the remaining balance of " + money(student.balance) + "."); return; }
      setPayState(true, "Sending…");
      showPayNotice("Sending the payment request to M-Pesa…");
      try {
        const { data, error } = await sb.functions.invoke('fee-api', { body: { action: 'stk_push', student_id: studentId, amount, phone } });
        if (error) {
          const status = error.context && error.context.status;
          const howToPay = `Please pay from your M-Pesa menu: Paybill ${school.paybill || "(ask the school)"}, account number ${student.adm}.`;
          // 404 = function missing, 409/503 = the school has not set up M-Pesa yet: either way give the manual way to pay
          throw Object.assign(new Error(status === 404
            ? `Online payment is not available yet. ${howToPay}`
            : (status === 409 || status === 503) ? `${await fnErrorMessage(error)} ${howToPay}`
            : await fnErrorMessage(error)), { handled: true });
        }
        if (!data || !data.payment_id) throw Object.assign(new Error("The payment service did not respond properly. Please try again."), { handled: true });
        showPayNotice(`📱 <strong>Check your phone.</strong> Enter your M-Pesa PIN to pay <strong>${escapeHtml(money(amount))}</strong> for ${escapeHtml(student.name)}. Do not close this window.`);
        setPayState(true, "Waiting for M-Pesa…");
        waitForPayment(data.payment_id, student);
      } catch (e) {
        showPayNotice(escapeHtml(e.handled ? e.message : FF.friendlyError(e)), "error");
        setPayState(false);
      }
    }
    function waitForPayment(paymentId, student) {
      let tries = 0;
      clearInterval(payPollTimer);
      payPollTimer = setInterval(async () => {
        tries += 1;
        const { data } = await sb.from('payments').select('status, receipt_no, mpesa_receipt, result_desc').eq('id', paymentId).maybeSingle();
        if (data && data.status === 'completed') {
          clearInterval(payPollTimer);
          showPayNotice(`✓ <strong>Payment confirmed.</strong> Receipt ${escapeHtml(data.receipt_no || data.mpesa_receipt || "")}.`, "success");
          await refresh();
          setTimeout(() => { closeModal("paymentModal"); showView("payments"); }, 1200);
          setPayState(false);
        } else if (data && ["failed", "cancelled", "timeout"].includes(data.status)) {
          clearInterval(payPollTimer);
          showPayNotice(escapeHtml(data.result_desc || (data.status === "cancelled" ? "The payment was cancelled on your phone." : "The payment did not go through.")) + " You have not been charged. You can try again.", "error");
          setPayState(false);
        } else if (tries >= PAY_POLL_MAX) {
          clearInterval(payPollTimer);
          showPayNotice("We have not received confirmation yet. If M-Pesa has taken the money, it will appear under Payments shortly. <strong>Please do not pay again.</strong>");
          setPayState(false);
          refresh();
        }
      }, PAY_POLL_MS);
    }


    function printAllReceipts() {
      const printWindow = window.open("", "_blank", "width=760,height=820");
      if (!printWindow) { alert("Please allow pop-ups to print your receipts."); return; }
      printWindow.document.write(receiptsHtml(payments));
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }

    function downloadAllReceipts() {
      const blob = new Blob([receiptsHtml(payments)], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `FeeFlow-Receipts-${Date.now()}.html`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function printReceipt(paymentId) {
      const payment = payments.find(item => item.id === paymentId);
      if (!payment || payment.rawStatus !== 'completed') return;     // only confirmed payments have receipts
      const printWindow = window.open("", "_blank", "width=760,height=820");
      if (!printWindow) { alert("Please allow pop-ups to print your receipt."); return; }
      printWindow.document.write(receiptsHtml([payment]));
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
    }

    function downloadReceipt(paymentId) {
      const payment = payments.find(item => item.id === paymentId);
      if (!payment || payment.rawStatus !== 'completed') return;     // only confirmed payments have receipts

      const blob = new Blob([receiptsHtml([payment])], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `FeeFlow-Receipt-${payment.ref || payment.id}.html`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function markNotificationRead(notificationId) {
      const record = notifications.find(item => String(item.id) === String(notificationId));
      if (!record || !record.unread) return;
      const { error } = await sb.from('notifications').update({ unread: false }).eq('id', record.id);
      if (error) { toast(FF.friendlyError(error)); return; }
      record.unread = false;
      renderNotifications();
      updateNotificationBadge();
    }
    // (called by the old page but never defined, so deleting a notification used to crash)
    async function deleteNotification(notificationId) {
      const record = notifications.find(item => String(item.id) === String(notificationId));
      if (!record) return;
      const { error } = await sb.from('notifications').delete().eq('id', record.id);
      if (error) { toast(FF.friendlyError(error)); return; }
      notifications = notifications.filter(item => item !== record);
      renderNotifications();
      updateNotificationBadge();
    }

    async function markAllRead() {
      const { error } = await sb.from('notifications').update({ unread: false }).eq('audience', 'parent').eq('parent_id', parent.id).eq('unread', true);
      if (error) { toast(FF.friendlyError(error)); return; }
      notifications.forEach(item => { item.unread = false; });
      renderNotifications();
      updateNotificationBadge();
    }

    async function saveProfile() {
      const name = document.getElementById("profileName").value.trim();
      const email = document.getElementById("profileEmail").value.trim();
      if (name.length < 2) { alert("Enter your full name."); return; }
      if (!/^\S+@\S+\.\S+$/.test(email)) { alert("Enter a valid email address."); return; }
      const { error } = await sb.from('parents').update({ full_name: name, email }).eq('id', parent.id);
      if (error) { alert(FF.friendlyError(error)); return; }
      parent.name = name; parent.full_name = name; parent.email = email;
      renderShell(); renderAllViews(); showView("profile");
      alert("Profile updated successfully.");
    }
    async function changePassword() {
      const pw = document.getElementById("newPassword").value, pw2 = document.getElementById("newPassword2").value;
      if (pw.length < 8) { alert("Your password must be at least 8 characters."); return; }
      if (pw !== pw2) { alert("The two passwords do not match."); return; }
      const { error } = await sb.auth.updateUser({ password: pw });
      if (error) { alert(FF.friendlyError(error)); return; }
      document.getElementById("newPassword").value = ""; document.getElementById("newPassword2").value = "";
      alert("Password changed.");
    }

    function requestLogout() {
      if (confirm("Log out of your FeeFlow parent account?")) logout();
    }

    function logout() {
      clearInterval(payPollTimer);
      FF.signOut();
    }

    async function switchAccount() {
      const ids = allParents.map(x => x.school_id);
      const { data } = await sb.from('schools').select('id, name').in('id', ids);
      const names = Object.fromEntries((data || []).map(x => [x.id, x.name]));
      document.getElementById("app").innerHTML = `
        <div class="access-page"><div class="access-card">
          <div style="font-size:48px">🎓</div>
          <h1 style="margin-top:12px">Choose a school</h1>
          <p class="page-description" style="margin-bottom:18px">You are registered at more than one school.</p>
          ${allParents.map(x => `<button class="button button-outline" style="width:100%;margin-top:9px" onclick="selectParent('${escapeHtml(x.id)}')">${escapeHtml(names[x.school_id] || 'School')}</button>`).join("")}
        </div></div>`;
    }
    async function selectParent(parentId) {
      const next = allParents.find(x => x.id === parentId);
      if (!next) return;
      safeStorage.setItem('ff_parent_active', next.id);
      parent = next; parent.name = next.full_name;
      try { await loadSchoolData(); renderShell(); renderAllViews(); subscribeRealtime(); }
      catch (e) { renderMessagePage('Unable to load this school', FF.friendlyError(e)); }
    }

    document.addEventListener("change", event => {
      if (event.target && event.target.id === "paymentStudent") {
        updatePaymentAmountHint();
      }
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Enter" || event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey) return;
      const modal = document.getElementById("paymentModal");
      if (modal?.classList.contains("open") && modal.contains(event.target)) {
        event.preventDefault();
        makePayment();
      }
    });

    document.addEventListener("DOMContentLoaded", () => { setParentSidebarMode(currentParentSidebarMode); setTimeout(initParentAutoSuggestAndSearchableSelects, 100); setupParentSidebarResizer();
      document.querySelectorAll(".modal-backdrop").forEach(backdrop => {
        backdrop.addEventListener("click", event => {
          if (event.target === backdrop) backdrop.classList.remove("open");
        });
      });
    });

    window.addEventListener("error", event => { console.error(event.error || event.message); });
    function bootParentPortal() {
      initialize().catch(error => {
        console.error(error);
        if (document.getElementById("app")) renderMessagePage("Unable to load your dashboard", FF.friendlyError(error));
      });
    }
    bootParentPortal();
  </script>
</body>
</html>
