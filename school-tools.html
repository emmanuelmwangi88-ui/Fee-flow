<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FeeFlow — School Operations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c2d57">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FeeFlow">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
  <meta name="description" content="FeeFlow — import pupils, promote classes, approve reversals, manage staff, instalments, clearance, billing and support.">
  <link rel="stylesheet" href="css/ff.css">
</head>
<body>

<div id="app">
  <div id="unauthorizedPage" style="display:none">
    <div class="ff-empty">
      <i data-ico="lock"></i>
      <h2>Access Denied</h2>
      <p>You need to be signed in as a school administrator to use this page.</p>
      <a href="portal.html" class="ff-btn ff-btn-primary"><i data-ico="key"></i> Go to Login</a>
    </div>
  </div>

  <div class="ff-app" id="ffApp" style="display:none">
    <aside class="ff-sidebar">
      <div class="ff-brand">
        <div class="ff-brand-mark"><i data-ico="student"></i></div>
        <div>
          <div class="ff-brand-name">FeeFlow</div>
          <span class="ff-brand-tag">OPERATIONS</span>
        </div>
      </div>
      <div class="ff-school-name" id="schoolNameDisplay"><i data-ico="school"></i> <span>School</span></div>
      <div class="ff-school-name" id="roleChip"><i data-ico="user"></i> <span>…</span></div>

      <nav class="ff-nav">
        <div class="ff-nav-group">
          <div class="ff-nav-label">Pupils &amp; money</div>
          <div class="ff-nav-item active" data-tab="import" onclick="ST.go('import',this)" data-short="Import"><i data-ico="upload"></i> Import pupils</div>
          <div class="ff-nav-item" data-tab="promote" onclick="ST.go('promote',this)" data-short="Promote"><i data-ico="swap"></i> Promote classes</div>
          <div class="ff-nav-item" data-tab="reversals" onclick="ST.go('reversals',this)" data-short="Payment"><i data-ico="refresh"></i> Payment reversals</div>
          <div class="ff-nav-item" data-tab="instalments" onclick="ST.go('instalments',this)" data-short="Instalments"><i data-ico="calendar"></i> Instalments</div>
          <div class="ff-nav-item" data-tab="clearance" onclick="ST.go('clearance',this)" data-short="Fee"><i data-ico="checkCircle"></i> Fee clearance</div>
        </div>
        <div class="ff-nav-group">
          <div class="ff-nav-label">School account</div>
          <div class="ff-nav-item" data-tab="staff" onclick="ST.go('staff',this)" data-short="Staff"><i data-ico="users"></i> Staff &amp; roles</div>
          <div class="ff-nav-item" data-tab="billing" onclick="ST.go('billing',this)" data-short="Plan"><i data-ico="receipt"></i> Plan &amp; billing</div>
          <div class="ff-nav-item" data-tab="support" onclick="ST.go('support',this)" data-short="Support"><i data-ico="mail"></i> Support</div>
        </div>
      </nav>

      <div class="ff-sidebar-foot">
        <button class="ff-btn ff-btn-outline ff-btn-block" type="button" onclick="window.location.href='schooladmin.html'">
          <i data-ico="arrowLeft" data-size="ff-ico-sm"></i> Back to dashboard
        </button>
      </div>
    </aside>

    <div class="ff-main">
      <header class="ff-topbar">
        <button class="ff-btn ff-btn-icon ff-btn-ghost" type="button" data-ff-nav-toggle aria-label="Menu"><i data-ico="menu"></i></button>
        <div class="ff-crumb">FeeFlow / <strong id="pageTitle">Import pupils</strong></div>
        <div class="ff-topbar-right">
          <button class="ff-btn ff-btn-icon ff-btn-ghost" type="button" id="themeBtn" aria-label="Toggle dark mode"><i data-ico="moon"></i></button>
        </div>
      </header>

      <div class="ff-content">
        <div class="ff-alert warning" id="banner" style="display:none;margin-bottom:16px" role="alert"><i data-ico="alert"></i><div id="bannerText"></div></div>

        <section class="ff-view active" id="view-import"></section>
        <section class="ff-view" id="view-promote"></section>
        <section class="ff-view" id="view-reversals"></section>
        <section class="ff-view" id="view-instalments"></section>
        <section class="ff-view" id="view-clearance"></section>
        <section class="ff-view" id="view-staff"></section>
        <section class="ff-view" id="view-billing"></section>
        <section class="ff-view" id="view-support"></section>
      </div>
    </div>
  </div>
</div>

<!-- generic modal used for every small form on this page -->
<div class="ff-modal" id="modal-op">
  <div class="ff-modal-box">
    <div class="ff-modal-head">
      <div class="ff-modal-title" id="opTitle">…</div>
      <button class="ff-btn ff-btn-icon ff-btn-ghost" type="button" onclick="FFUI.closeModal('op')" aria-label="Close"><i data-ico="times"></i></button>
    </div>
    <div class="ff-modal-body" id="opBody"></div>
    <div class="ff-modal-foot">
      <button class="ff-btn ff-btn-outline" type="button" onclick="FFUI.closeModal('op')">Cancel</button>
      <button class="ff-btn ff-btn-primary" type="button" id="opOk">Save</button>
    </div>
  </div>
</div>

<script src="js/vendor/supabase-2.117.2.js"></script>
<script src="js/config.js"></script>
<script src="js/ff-client.js"></script>
<script src="js/ff-ui.js"></script>
<script src="js/i18n.js"></script>
<script src="js/school-tools.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
