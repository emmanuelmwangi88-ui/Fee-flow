<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fee Structure · FeeFlow</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link href="css/ff.css" rel="stylesheet">
<style>
  .fm { max-width: 1500px; margin: 0 auto; padding: 20px 24px 60px; }
  .fm-sections { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .chip { border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px; padding: 7px 16px; font: 600 13px var(--font-body); cursor: pointer; color: var(--text); }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip.add { border-style: dashed; color: var(--text-light); }
  .fm-grid { display: grid; grid-template-columns: 230px minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
  .rail { padding: 10px; position: sticky; top: 12px; }
  .rail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-light); margin: 6px 8px 8px; }
  .grade-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 9px 10px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; }
  .grade-item:hover { background: var(--bg); }
  .grade-item.active { background: #e8f0fb; color: var(--primary); }
  .grade-item small { font-weight: 500; color: var(--text-light); }
  .grade-item .warn { color: var(--warning); }
  .editor { padding: 18px; }
  .editor-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .editor-head h2 { margin: 0; font-size: 22px; }
  .editor-head p { margin: 4px 0 0; color: var(--text-light); font-size: 13px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .fee-table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }
  .fee-table th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-light); text-align: left; padding: 0 6px; }
  .fee-table th input { font: 700 11px var(--font-body); text-transform: uppercase; border: 1px dashed transparent; background: transparent; width: 100%; color: var(--text-light); padding: 2px; }
  .fee-table th input:hover, .fee-table th input:focus { border-color: var(--border); background: #fff; }
  .fee-table td { padding: 0 4px; vertical-align: middle; }
  .fee-table td .form-input { padding: 7px 9px; }
  .amt { text-align: right; min-width: 90px; }
  .fee-table .tot { font-weight: 700; white-space: nowrap; text-align: right; padding-right: 6px; font-size: 13px; }
  .board-flag { display: flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; color: var(--text-light); }
  .empty { text-align: center; padding: 36px 12px; color: var(--text-light); }
  .add-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .add-row select { max-width: 260px; }
  .totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; }
  .tot-box { background: var(--bg); border-radius: 12px; padding: 12px 14px; }
  .tot-box span { display: block; font-size: 12px; color: var(--text-light); }
  .tot-box b { font: 700 18px var(--font-head); }
  .tot-box.main { background: #e8f0fb; color: var(--primary); }
  .preview { padding: 18px; position: sticky; top: 12px; }
  .preview h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-light); }
  .doc { border: 1px solid var(--border); border-radius: 10px; padding: 18px; background: #fff; }
  .doc h4 { margin: 0; font-size: 17px; }
  .doc .sub { color: var(--text-light); font-size: 12px; margin-bottom: 12px; }
  .doc table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .doc th, .doc td { padding: 6px 4px; border-bottom: 1px solid var(--border); text-align: right; }
  .doc th:first-child, .doc td:first-child { text-align: left; }
  .doc tfoot td { font-weight: 700; border-top: 2px solid var(--primary); }
  .doc-footer { margin-top: 12px; font-size: 11.5px; color: var(--text-light); line-height: 1.5; }
  .setup { padding: 24px; margin-bottom: 16px; border-left: 4px solid var(--emerald); }
  .setup h2 { margin: 0 0 6px; }
  .setup ul { margin: 8px 0 14px 18px; color: var(--text-light); font-size: 14px; line-height: 1.6; }
  dialog { border: 0; border-radius: 16px; padding: 22px; max-width: 460px; width: calc(100% - 32px); box-shadow: 0 20px 50px rgba(15, 23, 42, .25); }
  dialog::backdrop { background: rgba(15, 23, 42, .45); }
  dialog h3 { margin: 0 0 6px; }
  .pick { max-height: 280px; overflow: auto; margin: 12px 0; display: grid; gap: 6px; }
  .pick label { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .mobile-tabs { display: none; }
  @media (max-width: 1180px) { .fm-grid { grid-template-columns: 200px minmax(0, 1fr); } .preview { grid-column: 1 / -1; position: static; } }
  @media (max-width: 760px) { .fm { padding: 12px 12px 60px; } .fm-grid { grid-template-columns: 1fr; } .rail { position: static; display: flex; overflow-x: auto; gap: 6px; } .rail h3 { display: none; } .grade-item { white-space: nowrap; } .fee-table { display: block; overflow-x: auto; } }
  @media print { .ff-topbar, .ff-banner, .fm-sections, .rail, .editor, .setup, .preview h3 { display: none !important; } .fm-grid { display: block; } .preview { border: 0; box-shadow: none; position: static; } .fm { padding: 0; } }
</style>
</head>
<body>
<header class="ff-topbar">
  <div class="brand"><i class="fas fa-layer-group"></i> Fee Structure</div>
  <div style="flex:1;min-width:160px;"><div id="schoolTitle" style="font-weight:700;"></div><div id="schoolType" style="font-size:12px;opacity:.8;"></div></div>
  <span id="ffStatus" style="font-size:12px;opacity:.9;"></span>
  <span id="ffPubInfo" style="font-size:12px;opacity:.75;"></span>
  <button id="ffBack" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Admin</button>
  <button id="ffSave" class="btn btn-outline"><i class="fas fa-floppy-disk"></i> Save draft</button>
  <button id="ffPublish" class="btn btn-success"><i class="fas fa-paper-plane"></i> Publish to parents</button>
</header>
<div id="ffBannerBox"></div>
<main class="fm">
  <section id="setupBox"></section>
  <div class="fm-sections" id="sectionTabs"></div>
  <div class="fm-grid">
    <aside class="card rail" id="gradeRail"></aside>
    <section class="card editor" id="editorCol"></section>
    <aside class="card preview" id="previewCol"></aside>
  </div>
</main>
<dialog id="dlg"></dialog>
<script src="js/vendor/supabase-2.117.2.js"></script>
<script src="js/config.js"></script>
<script src="js/ff-client.js"></script>
<script src="js/school-levels.js"></script>
<script src="js/fee-manager.js"></script>
</body>
</html>
